<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>I prodotti dei video</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E6;--ink:#2B2D42;--card:#fff;--accent:#FFC93C;--muted:#6b6f86}
@media (prefers-color-scheme:dark){:root{--bg:#1a1028;--ink:#f4efe6;--card:#2a2046;--muted:#b8b0cc}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:28px;margin:0 0 4px} .sotto{color:var(--muted);margin:0 0 22px}
.scheda{display:flex;gap:14px;align-items:center;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px;margin-bottom:14px;color:inherit;text-decoration:none;box-shadow:0 5px 0 var(--ink)}
.scheda:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.scheda img,.scheda .img{width:88px;height:88px;border-radius:14px;object-fit:cover;background:var(--accent);flex:none}
.nome{font-weight:600;font-size:18px;line-height:1.2} .cta{margin-top:6px;font-weight:700;color:#d1495b}
footer{color:var(--muted);font-size:13px;line-height:1.5;margin-top:26px}
</style></head><body><main>
<h1>I prodotti dei video 👇</h1><p class="sotto">Il più recente è in alto. Prezzi sempre aggiornati su Amazon.</p>
<div id="elenco"><p>Caricamento…</p></div>
<footer>In qualità di Affiliato Amazon ricevo un guadagno dagli acquisti idonei. Le immagini sono illustrazioni indicative create per i video.</footer>
</main>
<script>
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
fetch("https://affiliate-automation.noramarket-0f9e.workers.dev/prodotti.json", {cache: "no-store"}).then((r) => r.json()).then((v) => {
  document.getElementById("elenco").innerHTML = v.length ? v.map((p) => `<a class="scheda" href="${esc(p.link)}" rel="sponsored nofollow noopener" target="_blank">
    ${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : '<div class="img"></div>'}
    <div class="testo"><div class="nome">${esc(p.nome)}</div><div class="cta">Vedi su Amazon →</div></div></a>`).join("") : "<p>In arrivo.</p>";
}).catch(() => { document.getElementById("elenco").innerHTML = "<p>Ricarica la pagina tra poco.</p>"; });
</script></body></html>
